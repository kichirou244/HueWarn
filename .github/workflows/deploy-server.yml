name: Deploy Server

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Remote VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and package server
        run: |
          cd server
          npm install
          npm run build
          tar -czf ../server-bundle.tar.gz package.json package-lock.json tsconfig.json dist src
          cd ..

      - name: Parse VPS credentials
        id: vps
        run: |
          cat << 'EOF' > /tmp/env_vps
          ${{ secrets.ENV_VPS }}
          EOF

          HOST=$(grep -E '^VPS_HOST=' /tmp/env_vps | cut -d '=' -f2- | tr -d '\r"' || true)
          PORT=$(grep -E '^VPS_PORT=' /tmp/env_vps | cut -d '=' -f2- | tr -d '\r"' || true)
          USER=$(grep -E '^VPS_USERNAME=' /tmp/env_vps | cut -d '=' -f2- | tr -d '\r"' || true)
          PASS=$(grep -E '^VPS_PASSWORD=' /tmp/env_vps | cut -d '=' -f2- | tr -d '\r"' || true)

          if [ -z "$HOST" ]; then
            HOST=$(echo '${{ secrets.ENV_VPS }}' | jq -r '.VPS_HOST // empty' 2>/dev/null || true)
            PORT=$(echo '${{ secrets.ENV_VPS }}' | jq -r '.VPS_PORT // empty' 2>/dev/null || true)
            USER=$(echo '${{ secrets.ENV_VPS }}' | jq -r '.VPS_USERNAME // empty' 2>/dev/null || true)
            PASS=$(echo '${{ secrets.ENV_VPS }}' | jq -r '.VPS_PASSWORD // empty' 2>/dev/null || true)
          fi

          HOST=${HOST:-${{ secrets.VPS_HOST }}}
          PORT=${PORT:-${{ secrets.VPS_PORT }}}
          PORT=${PORT:-22}
          USER=${USER:-${{ secrets.VPS_USERNAME }}}
          USER=${USER:-root}
          PASS=${PASS:-${{ secrets.VPS_PASSWORD }}}

          rm -f /tmp/env_vps

          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "user=$USER" >> $GITHUB_OUTPUT
          echo "::add-mask::$PASS"
          echo "pass=$PASS" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        env:
          HOST: ${{ steps.vps.outputs.host }}
          PORT: ${{ steps.vps.outputs.port }}
          USER: ${{ steps.vps.outputs.user }}
          PASS: ${{ steps.vps.outputs.pass }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$PASS"
          SSH_CMD="sshpass -e ssh -p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $USER@$HOST"

          $SSH_CMD "mkdir -p ~/huewarn"
          cat server-bundle.tar.gz | $SSH_CMD "tar -xzf - -C ~/huewarn"

          cat << 'EOF' > /tmp/deploy.env
          ${{ secrets.ENV }}
          EOF
          cat /tmp/deploy.env | $SSH_CMD "cat > ~/huewarn/.env"
          rm -f /tmp/deploy.env

          $SSH_CMD << 'REMOTE_SCRIPT'
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:~/.npm-global/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
          [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
          [ -s "$HOME/.profile" ] && . "$HOME/.profile"
          [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc"

          cd ~/huewarn
          if [ -f ".env" ]; then
            grep -q '^PORT=' .env && sed -i 's/^PORT=.*/PORT=4007/' .env || echo "PORT=4007" >> .env
          else
            echo "PORT=4007" > .env
          fi

          npm install
          npm run build

          pm2 describe huewarn-server > /dev/null 2>&1 && pm2 restart huewarn-server --update-env || pm2 start dist/index.js --name "huewarn-server"
          pm2 save
          REMOTE_SCRIPT
